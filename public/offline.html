<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c111d" />
    <title>Offline — KudiLens</title>
    <style>
      :root { color-scheme: dark light; --bg: #0c111d; --fg: #f3f5f9; --muted: #9aa3b5; --accent: #3fd9a6; }
      @media (prefers-color-scheme: light) { :root { --bg: #f6f7fa; --fg: #1a2233; --muted: #5c667a; --accent: #12946c; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 8px; letter-spacing: -0.02em; }
      p { color: var(--muted); margin: 0 0 24px; }
      button { appearance: none; border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 600;
        background: var(--accent); color: #06231a; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>KudiLens needs a connection to load your latest numbers. Your data is safe; reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
