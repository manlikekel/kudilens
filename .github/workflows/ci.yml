name: CI

# Runs on every pull request and on every change to main, including commits Lovable makes, so a
# change that breaks the type-check, the tests or the build is caught before (or right after) it
# reaches the live app.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
